name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The suite is stdlib unittest and needs no terminal, so it runs anywhere.
  # 3.9 is the floor because the packed reader has to run on an untouched
  # machine; 3.13 is the ceiling anyone is likely to have.
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && python -m pip install urwid
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v

  # The tests above never open a terminal. This one does: a real pty, real
  # keystrokes, real SIGWINCH -- the only way to catch a regression in what
  # is actually on screen. Linux only; pty behaves differently on macOS
  # runners and a flaky end-to-end check is worse than none.
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install urwid
      - name: esc climbs the tree
        run: python tools/drive.py --escape
      - name: a shelf of books
        run: python tools/drive.py --shelf
      - name: type a document and re-lay it
        run: python tools/drive.py
      - name: click in, click off
        run: python tools/drive.py --clicks
      - name: the folder dialog and the theme toggle
        run: python tools/drive.py --library

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: it builds and installs
        run: |
          python -m build
          python -m pip install dist/*.whl
          inkwell --help
          inkwell-reader --help
