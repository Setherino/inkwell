[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The import package is `inkwell`; the distribution is `inkwell-notes`
# because `inkwell` is taken on PyPI.
name = "inkwell-notes"
version = "0.1.0"
description = "A terminal notebook that formats itself."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Seth Ciancio" }]
keywords = ["terminal", "notes", "tui", "urwid", "notebook", "latex", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

# urwid is the only dependency, and the only one there will be: the PDF
# writer, the TrueType parser, the LaTeX typesetter and the clipboard are
# all stdlib on purpose.
dependencies = ["urwid>=2.1"]

[project.urls]
Homepage = "https://github.com/Setherino/inkwell"
Source = "https://github.com/Setherino/inkwell"
Issues = "https://github.com/Setherino/inkwell/issues"

[project.scripts]
inkwell = "inkwell.app:main"
inkwell-reader = "inkwell.reader:main"

[tool.setuptools]
packages = ["inkwell"]

[tool.setuptools.package-data]
# Only ever populated by tools/build_reader.py, inside a built archive.
inkwell = ["book/*.json"]
